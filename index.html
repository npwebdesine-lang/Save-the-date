<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>נתיב ואוראל · שמרו את התאריך</title>
  <meta name="description" content="נתיב ואוראל מתחתנים! שמרו את התאריך – 17.12.2026" />
  <meta name="theme-color" content="#f8f3ec" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="נתיב ואוראל · Save the Date" />
  <meta property="og:description" content="יום חמישי, 17 בדצמבר 2026 · שמרו את התאריך" />
  <meta property="og:image" content="https://npwebdesine-lang.github.io/Save-the-date/assets/couple.jpg" />
  <meta property="og:locale" content="he_IL" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8D%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&family=Great+Vibes&family=Heebo:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Corner floral accents -->
  <svg class="floral floral--top" viewBox="0 0 220 220" aria-hidden="true"><use href="#sprig" /></svg>
  <svg class="floral floral--bottom" viewBox="0 0 220 220" aria-hidden="true"><use href="#sprig" /></svg>

  <main class="card">
    <p class="kicker" lang="en" dir="ltr">Save the Date</p>

    <h1 class="names">
      <span>נתיב</span>
      <span class="amp">&amp;</span>
      <span>אוראל</span>
    </h1>

    <p class="tagline">מתחתנים!</p>

    <svg class="divider" viewBox="0 0 240 24" aria-hidden="true">
      <path d="M8 12h88M144 12h88" />
      <path class="leaf" d="M100 12c6-7 14-7 20 0-6 7-14 7-20 0zM120 12c6-7 14-7 20 0-6 7-14 7-20 0z" />
      <circle cx="120" cy="12" r="2.4" />
    </svg>

    <figure class="photo">
      <div class="photo__frame">
        <img src="assets/couple.jpg" alt="נתיב ואוראל אוחזים ידיים, טבעת האירוסין על היד" width="1200" height="1800" />
      </div>
    </figure>

    <section class="date" aria-label="תאריך החתונה">
      <div class="date__side">יום חמישי</div>
      <div class="date__main" dir="ltr">
        <span class="date__num">17</span>
        <span class="date__sep"></span>
        <span class="date__num">12</span>
        <span class="date__sep"></span>
        <span class="date__num">26</span>
      </div>
      <div class="date__side">ז׳ בטבת תשפ״ז</div>
    </section>

    <p class="invite">
      נשמח לחגוג אתכם את היום המאושר בחיינו.<br />
      הזמנה רשמית תישלח בהמשך.
    </p>

    <div class="countdown" id="countdown" aria-live="polite">
      <div><span data-unit="days">–</span><small>ימים</small></div>
      <div><span data-unit="hours">–</span><small>שעות</small></div>
      <div><span data-unit="minutes">–</span><small>דקות</small></div>
      <div><span data-unit="seconds">–</span><small>שניות</small></div>
    </div>

    <div class="cal">
      <button class="btn" id="calBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="calMenu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" /><path d="M3.5 10h17M8 3v4M16 3v4" /></svg>
        הוסף ליומן
      </button>
      <div class="cal__menu" id="calMenu" role="menu" hidden>
        <a role="menuitem" id="gcalLink" target="_blank" rel="noopener">Google Calendar</a>
        <button role="menuitem" type="button" id="icsBtn">Apple / Outlook (‎.ics)</button>
      </div>
    </div>

    <footer class="foot">
      <span lang="en" dir="ltr">Nativ &amp; Orel · 17.12.2026</span>
    </footer>
  </main>

  <!-- Reusable botanical sprig -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="sprig" viewBox="0 0 220 220">
        <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <path d="M6 214C46 160 92 108 206 10" />
          <path d="M60 150c-18-6-30-20-32-38 18 4 30 18 32 38z" fill="#9aac94" fill-opacity="0.28" />
          <path d="M60 150c4-18 18-30 36-32-4 18-18 30-36 32z" fill="#9aac94" fill-opacity="0.28" />
          <path d="M100 106c-16-8-26-22-26-40 16 6 26 20 26 40z" fill="#9aac94" fill-opacity="0.28" />
          <path d="M100 106c6-17 21-27 39-27-6 17-21 27-39 27z" fill="#9aac94" fill-opacity="0.28" />
          <path d="M140 66c-14-9-22-24-20-41 15 8 22 23 20 41z" fill="#9aac94" fill-opacity="0.28" />
          <path d="M140 66c8-15 23-23 40-21-8 15-23 23-40 21z" fill="#9aac94" fill-opacity="0.28" />
          <path d="M30 186c-15-4-25-15-27-30 15 3 25 14 27 30z" fill="#9aac94" fill-opacity="0.28" />
        </g>
        <g fill="#e9c9c3">
          <circle cx="182" cy="30" r="9" />
          <circle cx="170" cy="22" r="6" />
          <circle cx="40" cy="132" r="5" />
        </g>
      </symbol>
    </defs>
  </svg>

  <script src="script.js"></script>
</body>
</html>
