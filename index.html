<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>נתיב ואוראל · שמרו את התאריך</title>
    <meta
      name="description"
      content="נתיב ואוראל מתחתנים! שמרו את התאריך – 17.12.2026"
    />
    <meta name="theme-color" content="#f8f3ec" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://save-the-date-dusky-gamma.vercel.app/" />
    <meta property="og:site_name" content="נתיב & אוראל" />
    <meta property="og:title" content="💍 נתיב ואוראל מתחתנים!" />
    <meta
      property="og:description"
      content="שמרו את התאריך · יום חמישי, 17.12.2026 · ז׳ בטבת תשפ״ז"
    />
    <meta
      property="og:image"
      content="https://save-the-date-dusky-gamma.vercel.app/assets/og-image.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="נתיב ואוראל מחובקים בין עצי האורן בהרים" />
    <meta property="og:locale" content="he_IL" />
    <meta name="twitter:card" content="summary_large_image" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8D%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&family=Great+Vibes&family=Heebo:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="skip-link" href="#invitation">דלגו להזמנה</a>
    <main class="invitation" id="invitation">
      <figure class="photo">
        <img
          src="assets/savethedate.jpeg"
          alt="נתיב ואוראל אוחזים ידיים, טבעת האירוסין על היד"
          width="1200"
          height="1800"
          fetchpriority="high"
        />
      </figure>

      <div class="invitation__copy">
        <p class="kicker" lang="en" dir="ltr">Save the Date</p>

        <header class="identity">
          <h1 class="names">
            <span>נתיב</span>
            <span class="amp" aria-hidden="true">&amp;</span>
            <span>אוראל</span>
          </h1>
          <p class="tagline">מתחתנים!</p>
        </header>

        <section class="date" aria-label="תאריך החתונה">
          <div class="date__item date__item--day">
            <span class="date__label">יום חמישי</span>
            <strong class="date__num">17</strong>
            <span class="date__detail">דצמבר 2026</span>
          </div>
          <div class="date__item date__item--hebrew">
            <span class="date__label">תאריך עברי</span>
            <strong class="date__num">ז׳</strong>
            <span class="date__detail">בטבת תשפ״ז</span>
          </div>
        </section>

        <p class="invite">
          נשמח לחגוג אתכם את היום המאושר בחיינו.<br />
          הזמנה רשמית תישלח בהמשך.
        </p>

        <div class="countdown-wrap">
          <p class="countdown__label">נותרו עד החתונה</p>
          <div
            class="countdown"
            id="countdown"
            role="timer"
            aria-label="ספירה לאחור לחתונה"
          >
            <div><span data-unit="days">–</span><small>ימים</small></div>
            <div><span data-unit="hours">–</span><small>שעות</small></div>
            <div><span data-unit="minutes">–</span><small>דקות</small></div>
            <div><span data-unit="seconds">–</span><small>שניות</small></div>
          </div>
        </div>

        <div class="cal">
          <button
            class="btn"
            id="calBtn"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="calMenu"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="5" width="17" height="15.5" rx="2.5" />
              <path d="M3.5 10h17M8 3v4M16 3v4" />
            </svg>
            הוסף ליומן
          </button>
          <div class="cal__menu" id="calMenu" role="menu" hidden>
            <a role="menuitem" id="gcalLink" target="_blank" rel="noopener"
              >Google Calendar</a
            >
            <button role="menuitem" type="button" id="icsBtn">
              Apple / Outlook (.ics)
            </button>
          </div>
        </div>

        <footer class="foot">
          <span lang="en" dir="ltr"
            >Nativ &amp; Orel <span>·</span> 17.12.2026</span
          >
        </footer>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
